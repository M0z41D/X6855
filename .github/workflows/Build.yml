name: OrangeFox Recovery Build for Infinix X6855

on:
  workflow_dispatch:

jobs:
  build:
    name: Build OrangeFox Vendor Boot
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    - name: Clean and Setup Build Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get update -y
        sudo apt-get install -y --fix-missing bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncursesBerdasarkan screenshot log GitHub Actions, status build menunjukkan **Failure (1m 9s)** dengan eror **Process completed with exit code 100**.

Eror ini terjadi pada detik awal (1 menit pertama) yang mengindikasikan kegagalan saat pemasangan paket dependency (`apt-get install`) atau clone repositori device tree.

---

### Penyebab Eror Exit Code 100
Pada runner `ubuntu-22.04`, beberapa paket lama seperti `libncurses5` atau `lib32ncurses5-dev` sering kali mengalami konflik paket (*unmet dependencies*) saat dieksekusi via `apt-get install`, yang menghasilkan `exit code 100`.

---

### Solusi Pembaruan Workflow (`build.yml`)

Ganti isi file `.github/workflows/build.yml` dengan skrip yang sudah diperbaiki berikut:

```yaml
name: OrangeFox Recovery Build for Infinix X6855

on:
  workflow_dispatch:

jobs:
  build:
    name: Build OrangeFox Vendor Boot
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Workflow Repository
      uses: actions/checkout@v4

    - name: Clean and Setup Build Environment
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl [https://storage.googleapis.com/git-repo-downloads/repo](https://storage.googleapis.com/git-repo-downloads/repo) > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize & Sync OrangeFox Source
      run: |
        mkdir -p ~/fox_12.1
        cd ~/fox_12.1
        repo init -u [https://gitlab.com/OrangeFox/Manifest.git](https://gitlab.com/OrangeFox/Manifest.git) -b fox_12.1 --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        git clone [https://github.com/M0z41D/X6855.git](https://github.com/M0z41D/X6855.git) ~/fox_12.1/device/infinix/X6855

    - name: Build Vendor Boot Image
      run: |
        cd ~/fox_12.1
        source build/envsetup.sh
        lunch omni_X6855-eng || lunch fox_X6855-eng
        mka vendorbootimage -j$(nproc --all)

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox_Vendor_Boot_X6855
        path: ~/fox_12.1/out/target/product/X6855/vendor_boot.img
