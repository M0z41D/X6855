name: Generate Device Tree Generator

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Pilih jenis custom recovery'
        required: true
        default: 'orangefox'
        type: choice
        options:
          - orangefox
          - twrp
      device_codename:
        description: 'Codename Perangkat (Contoh: X6855)'
        required: true
        default: 'X6855'
        type: string

jobs:
  generate-tree:
    name: Generate Device Tree for ${{ inputs.device_codename }}
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Generate Device Tree Skeleton
      run: |
        echo "Membuat kerangka device tree untuk platform ${{ inputs.target_platform }}..."
        mkdir -p device/infinix/${{ inputs.device_codename }}
        
        # Membuat file konfigurasi dasar BoardConfig.mk otomatis
        cat << 'EOF' > device/infinix/${{ inputs.device_codename }}/BoardConfig.mk
        # Auto-generated BoardConfig.mk for ${{ inputs.device_codename }}
        TARGET_ARCH := arm64
        TARGET_CPU_ABI := arm64-v8a
        TARGET_BOARD_PLATFORM := mt6789
        
        # Recovery Configs
        BOARD_USES_VENDOR_BOOTIMAGE := true
        BOARD_BUILD_VENDOR_BOOT_IMAGE := true
        EOF

        echo "Struktur folder dan BoardConfig.mk berhasil dibuat!"

    - name: Upload Generated Tree Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Device_Tree_${{ inputs.device_codename }}_${{ inputs.target_platform }}
        path: device/infinix/${{ inputs.device_codename }}/
        
