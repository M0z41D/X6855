name: Universal Recovery Device Tree Generator (TWRP & OrangeFox)

on:
  workflow_dispatch:

jobs:
  generate-dual-tree:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget unzip python3 python3-pip cpio findutils zip

      - name: Download Firmware Dump from GitLab
        run: |
          echo "Mengunduh firmware dump Infinix X6855..."
          git clone --depth=1 https://gitlab.com/rama-firmware-dumps/infinix/Infinix-X6855.git firmware_dump
          ls -la firmware_dump/

      - name: Generate Dual-Support Ready-to-Build Recovery Tree
        run: |
          CODENAME="X6855"
          DIR="device/infinix/$CODENAME"
          
          # Membuat struktur folder lengkap untuk recovery
          mkdir -p $DIR/recovery/root/etc
          mkdir -p $DIR/rootdir/etc
          mkdir -p $DIR/sepolicy

          echo "Menyalin biner esensial secara presisi..."
          find firmware_dump/ -name "kernel" -o -name "Image" | head -n 1 | xargs -I {} cp {} $DIR/kernel
          find firmware_dump/ -name "dtb" | head -n 1 | xargs -I {} cp {} $DIR/dtb
          find firmware_dump/ -name "dtbo.img" | head -n 1 | xargs -I {} cp {} $DIR/dtbo.img

          echo "Membuat BoardConfig.mk Universal (TWRP & OrangeFox Ready)..."
          cat << 'EOF' > $DIR/BoardConfig.mk
          # --- Platform & Architecture ---
          TARGET_ARCH := arm64
          TARGET_CPU_ABI := arm64-v8a
          TARGET_CPU_SMP := true
          TARGET_BOARD_PLATFORM := mt6789

          # --- Kernel & Prebuilts ---
          TARGET_PREBUILT_KERNEL := device/infinix/X6855/kernel
          BOARD_PREBUILT_DTB := device/infinix/X6855/dtb
          BOARD_KERNEL_SEPARATED_DTB := true
          BOARD_PREBUILT_DTBOIMAGE := device/infinix/X6855/dtbo.img
          BOARD_BOOTIMG_HEADER_VERSION := 4

          # --- Virtual A/B & Recovery Partition Flags ---
          BOARD_USES_VENDOR_BOOTIMAGE := true
          BOARD_BUILD_VENDOR_BOOT_IMAGE := true
          BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT := true

          # --- File Systems & Storage ---
          BOARD_HAS_LARGE_FILESYSTEM := true
          BOARD_BOOTIMAGE_PARTITION_TYPE := ext4
          BOARD_USERDATAIMAGE_FILE_SYSTEM_TYPE := f2fs
          BOARD_VENDORIMAGE_FILE_SYSTEM_TYPE := ext4

          # --- Universal Recovery / OrangeFox / TWRP Configurations ---
          TW_THEME := portrait_hdpi
          RECOVERY_SDCARD_ON_DATA := true
          TARGET_USE_CUSTOM_LCHMOD := true
          TW_EXCLUDE_DEFAULT_USB_STORAGE := true
          TW_USE_TOOLBOX := true
          TW_INCLUDE_NTFS_3G := true
          TW_USE_NEW_MINADBD := true
          
          # Recovery Display & Touch Fixes
          TW_BRIGHTNESS_PATH := "/sys/class/backlight/panel/brightness"
          TW_MAX_BRIGHTNESS := 255
          TW_DEFAULT_BRIGHTNESS := 100
          TW_Y_OFFSET := 0
          TW_H_OFFSET := 0

          # Dual Recovery Flags Compatibility
          TW_INCLUDE_ENCRYPTED_BACKUPS := true
          TW_USE_MODEL_HARDWARE_ID_FOR_DEVICE_ID := true
          EOF

          echo "Membuat device.mk..."
          cat << 'EOF' > $DIR/device.mk
          LOCAL_PATH := device/infinix/X6855

          PRODUCT_PACKAGES += \
              init.recovery.hardware.rc \
              fstab.mt6789

          PRODUCT_VNDK_VERSION := current
          EOF

          echo "Membuat fstab.mt6789 spesifik MT6789 Virtual A/B..."
          cat << 'EOF' > $DIR/rootdir/etc/fstab.mt6789
          # -----------------------------------------------------------------
          # Universal Recovery fstab for Infinix Note 50 Pro (X6855)
          # -----------------------------------------------------------------
          #<src>                                                 <mnt_point>         <type>    <mnt_flags and options>                            <fs_mgr_flags>
          system                                                  /system             ext4      ro,barrier=1                                         avb=vboot,logical,first_stage_mount
          vendor                                                  /vendor             ext4      ro,barrier=1                                         avb=vboot,logical,first_stage_mount
          product                                                 /product            ext4      ro,barrier=1                                         avb=vboot,logical,first_stage_mount
          system_ext                                              /system_ext         ext4      ro,barrier=1                                         avb=vboot,logical,first_stage_mount
          odm                                                     /odm                ext4      ro,barrier=1                                         avb=vboot,logical,first_stage_mount
          
          /dev/block/by-name/boot                                 /boot               emmc      defaults                                             recoveryonly
          /dev/block/by-name/recovery                             /recovery           emmc      defaults                                             recoveryonly
          /dev/block/by-name/userdata                             /data               f2fs      noatime,nosuid,nodev,discard,inlinecrypt             latemount,wait,check,quota,formattable,fileencryption=aes-256-xts:aes-256-cts:v2+inlinecrypt_optimized
          /dev/block/by-name/cache                                /cache              ext4      noatime,nosuid,nodev,barrier=1                       wait,check
          /dev/block/by-name/metadata                             /metadata           ext4      noatime,nosuid,nodev,discard,sync,noauto_da_alloc    wait,formattable,first_stage_mount
          /dev/block/by-name/dtbo                                 /dtbo               emmc      defaults                                             recoveryonly
          /dev/block/by-name/para                                 /persistent         emmc      defaults                                             recoveryonly
          /dev/block/by-name/frp                                  /frp                emmc      defaults                                             recoveryonly
          /dev/block/by-name/nvdata                               /nvdata             ext4      noatime,nosuid,nodev,discard                         wait,check
          /dev/block/by-name/nvcfg                                /nvcfg              ext4      noatime,nosuid,nodev,discard                         wait,check
          
          # External Storage
          /devices/platform/externdevice*                         /auto-sdcard        auto      defaults                                             voldmanaged=sdcard1:auto,noemulatedsd
          /devices/platform/soc/*.usb/*.usb-*                     /usb-otg            auto      defaults                                             voldmanaged=usbotg:auto
          EOF

          # Salin fstab ke direktori ramdisk recovery
          cp $DIR/rootdir/etc/fstab.mt6789 $DIR/recovery/root/etc/recovery.fstab

          echo "Membuat twrp_X6855.mk (Untuk TWRP Source)..."
          cat << 'EOF' > $DIR/twrp_X6855.mk
          $(call inherit-product, $(SRC_TARGET_DIR)/product/full_base_telephony.mk)
          $(call inherit-product, vendor/omni/config/common.mk)
          $(call inherit-product, device/infinix/X6855/device.mk)

          PRODUCT_DEVICE := X6855
          PRODUCT_NAME := twrp_X6855
          PRODUCT_BRAND := Infinix
          PRODUCT_MODEL := Infinix Note 50 Pro
          PRODUCT_MANUFACTURER := infinix
          EOF

          echo "Membuat fox_X6855.mk (Untuk OrangeFox Source)..."
          cat << 'EOF' > $DIR/fox_X6855.mk
          $(call inherit-product, $(SRC_TARGET_DIR)/product/full_base_telephony.mk)
          $(call inherit-product, vendor/omni/config/common.mk)
          $(call inherit-product, device/infinix/X6855/device.mk)

          PRODUCT_DEVICE := X6855
          PRODUCT_NAME := fox_X6855
          PRODUCT_BRAND := Infinix
          PRODUCT_MODEL := Infinix Note 50 Pro
          PRODUCT_MANUFACTURER := infinix
          EOF

          echo "Membuat vendorsetup.sh dengan target lunch twrp_X6855 dan fox_X6855..."
          cat << 'EOF' > $DIR/vendorsetup.sh
          add_lunch_combo twrp_X6855-eng
          add_lunch_combo twrp_X6855-userdebug
          add_lunch_combo fox_X6855-eng
          add_lunch_combo fox_X6855-userdebug
          EOF

          echo "Universal Dual Recovery Device Tree (TWRP & OrangeFox) selesai di-generate!"

      - name: Archive Dual Recovery Tree
        run: |
          zip -r Universal_Dual_Recovery_Tree_X6855.zip device/infinix/X6855

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal_Dual_Recovery_Tree_X6855
          path: Universal_Dual_Recovery_Tree_X6855.zip
