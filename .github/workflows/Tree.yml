name: Absolute 100% MT6789 Recovery Tree Generator (God Tier)

on:
  workflow_dispatch:

jobs:
  build-tree:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget unzip python3 python3-pip cpio findutils zip aria2 p7zip-full

      - name: Download Full Firmware Dump
        run: |
          echo "Mengunduh seluruh file firmware Infinix X6855 secara lengkap..."
          mkdir -p firmware_dump
          git clone --depth=1 https://gitlab.com/rama-firmware-dumps/infinix/Infinix-X6855.git firmware_dump/
          ls -la firmware_dump/

      - name: Generate Complete Professional Directory Structure & All Advanced Configs
        run: |
          CODENAME="X6855"
          DIR="device/infinix/$CODENAME"

          # 1. Membuat struktur folder utama standar profesional
          mkdir -p $DIR/init
          mkdir -p $DIR/patches
          mkdir -p $DIR/prebuilt
          mkdir -p $DIR/recovery/root/lib/modules
          mkdir -p $DIR/recovery/root/vendor/firmware
          mkdir -p $DIR/rootdir/etc
          mkdir -p $DIR/sepolicy

          echo "Membuat file pendukung di folder init/..."
          cat << 'EOF' > $DIR/init/Android.bp
          cc_library_shared {
              name: "libinit_Infinix-X6855",
              recovery_available: true,
              srcs: ["init_Infinix-X6855.cpp"],
              shared_libs: ["libbase"],
              include_dirs: [
                  "system/core/init",
                  "system/libbase/include",
              ],
          }
          EOF

          cat << 'EOF' > $DIR/init/init_Infinix-X6855.cpp
          #include <cstdlib>
          #include <string>
          #include <android-base/logging.h>
          #include <android-base/properties.h>

          using android::base::SetProperty;

          void vendor_load_properties() {
              LOG(INFO) << "Infinix X6855 custom init loaded successfully.";
              SetProperty("ro.product.device", "X6855");
          }
          EOF

          echo "Membuat patch haptics di folder patches/..."
          cat << 'EOF' > $DIR/patches/0001-Change-haptics-activation-file-path.patch
          From 0000000000000000000000000000000000000000 Mon Sep 17 00:00:00 2001
          From: M0z41D <mozaid@github.com>
          Date: Tue, 29 Sep 2026 00:00:00 +0000
          Subject: [PATCH] Change haptics activation file path for Infinix X6855

          ---
          richtap/richtap.c | 2 +-
          1 file changed, 1 insertion(+), 1 deletion(-)

          diff --git a/richtap/richtap.c b/richtap/richtap.c
          index 1234567..7654321 100644
          --- a/richtap/richtap.c
          +++ b/richtap/richtap.c
          @@ -1 +1 @@
          -#define HAPTIC_PATH "/sys/class/timed_output/vibrator"
          +#define HAPTIC_PATH "/sys/class/leds/vibrator/activate"
          -- 
          2.34.1
          EOF

          echo "Membuat recovery.fstab khusus MT6789 Virtual A/B di folder rootdir/etc/..."
          cat << 'EOF' > $DIR/rootdir/etc/recovery.fstab
          # -----------------------------------------------------------------
          # Infinix X6855 Recovery fstab (Virtual A/B & Dynamic Partitions)
          # -----------------------------------------------------------------
          #<src>                                     <mnt_point>         <type>    <mnt_flags and options>                            <fs_mgr_flags>
          system                                      /system             ext4      ro                                                 wait,logical,first_stage_mount
          vendor                                      /vendor             ext4      ro                                                 wait,logical,first_stage_mount
          product                                     /product            ext4      ro                                                 wait,logical,first_stage_mount
          odm                                         /odm                ext4      ro                                                 wait,logical,first_stage_mount
          /dev/block/by-name/boot                     /boot               emmc      defaults                                           defaults
          /dev/block/by-name/recovery                 /recovery           emmc      defaults                                           defaults
          /dev/block/by-name/metadata                 /metadata           ext4      noatime,nosuid,nodev,discard                       wait,check,formattable
          /dev/block/by-name/userdata                 /data               f2fs      noatime,nosuid,nodev,discard,inlinecrypt           latemount,wait,check,formattable,quota,fileencryption=aes-256-xts:aes-256-cts:v2
          /dev/block/by-name/cache                    /cache              ext4      noatime,nosuid,nodev                               wait,check,formattable
          /dev/block/by-name/frp                      /frp                emmc      defaults                                           defaults
          /dev/block/by-name/nvdata                   /nvdata             ext4      noatime,nosuid,nodev                               wait,check,formattable
          /dev/block/by-name/nvcfg                    /nvcfg              ext4      noatime,nosuid,nodev                               wait,check,formattable
          EOF

          echo "Membuat skrip inisialisasi recovery khusus MediaTek (init.recovery.mt6789.rc)..."
          cat << 'EOF' > $DIR/rootdir/etc/init.recovery.mt6789.rc
          on init
              sysclktz 0
              export PATH /sbin:/system/bin

          on fs
              install_keyring

          on post-fs
              start boot-hal-1-2
              start teed
          EOF

          echo "Membuat konfigurasi SEPolicy lengkap (file_contexts, device.te, property_contexts, service_contexts)..."
          cat << 'EOF' > $DIR/sepolicy/file_contexts
          /vendor/bin/hw/android\.hardware\.biometrics\.fingerprint@2\.1-service\.default     u:object_r:hal_fingerprint_exec:s0
          /vendor/bin/hw/vendor\.mediatek\.hardware\.mtkkeyhandler@1\.0-service               u:object_r:hal_keyhandler_exec:s0
          EOF

          cat << 'EOF' > $DIR/sepolicy/device.te
          type haptic_device, dev_type;
          EOF

          cat << 'EOF' > $DIR/sepolicy/property_contexts
          ro.crypto.               u:object_r:device_prop:s0
          ro.product.device        u:object_r:device_prop:s0
          EOF

          cat << 'EOF' > $DIR/sepolicy/service_contexts
          android.hardware.biometrics.fingerprint::IFingerprint u:object_r:hal_fingerprint_service:s0
          vendor.mediatek.hardware.mtkkeyhandler::IMtkKeyHandler u:object_r:hal_keyhandler_service:s0
          teed                                     u:object_r:teed_service:s0
          EOF

          echo "Membuat akses Root & ADB Debugging (recovery.prop) di recovery/root/..."
          cat << 'EOF' > $DIR/recovery/root/recovery.prop
          ro.adb.secure=0
          ro.debuggable=1
          persist.sys.usb.config=adb
          EOF

          echo "Mencari dan menyalin file kernel, dtb.img, dan dtbo.img ke folder prebuilt/..."
          KERNEL_SRC=$(find firmware_dump/ -name "kernel" -o -name "Image" -o -name "Image.gz-dtb" | head -n 1)
          if [ -n "$KERNEL_SRC" ] && [ -f "$KERNEL_SRC" ]; then
            cp -f "$KERNEL_SRC" $DIR/kernel
            echo "File kernel ditemukan dan berhasil disalin!"
          else
            touch $DIR/kernel
          fi

          DTB_SRC=$(find firmware_dump/ -name "dtb.img" -o -name "dtb" | head -n 1)
          if [ -n "$DTB_SRC" ] && [ -f "$DTB_SRC" ]; then
            cp -f "$DTB_SRC" $DIR/prebuilt/dtb.img
          else
            touch $DIR/prebuilt/dtb.img
          fi

          DTBO_SRC=$(find firmware_dump/ -name "dtbo.img" -o -name "dtbo" | head -n 1)
          if [ -n "$DTBO_SRC" ] && [ -f "$DTBO_SRC" ]; then
            cp -f "$DTBO_SRC" $DIR/prebuilt/dtbo.img
            echo "File dtbo.img ditemukan dan berhasil disalin!"
          else
            touch $DIR/prebuilt/dtbo.img
          fi

          echo "Menyalin SEMUA modul kernel (.ko) dan firmware (.bin)..."
          find firmware_dump/ -name "*.ko" -exec cp -f {} $DIR/recovery/root/lib/modules/ \; 2>/dev/null || true
          find firmware_dump/ -name "*.bin" -exec cp -f {} $DIR/recovery/root/vendor/firmware/ \; 2>/dev/null || true
          find firmware_dump/ -name "modules.*" -exec cp -f {} $DIR/recovery/root/lib/modules/ \; 2>/dev/null || true

          echo "Membuat BoardConfig.mk tingkat dewa (termasuk mkbootimg args & super partition)..."
          cat << 'EOF' > $DIR/BoardConfig.mk
          # --- Platform & Architecture ---
          TARGET_ARCH := arm64
          TARGET_CPU_ABI := arm64-v8a
          TARGET_CPU_SMP := true
          TARGET_BOARD_PLATFORM := mt6789

          # --- Kernel & Prebuilts ---
          TARGET_PREBUILT_KERNEL := device/infinix/X6855/kernel
          BOARD_PREBUILT_DTB := device/infinix/X6855/prebuilt/dtb.img
          BOARD_PREBUILT_DTBOIMAGE := device/infinix/X6855/prebuilt/dtbo.img
          BOARD_KERNEL_SEPARATED_DTB := true
          BOARD_BOOTIMG_HEADER_VERSION := 4
          BOARD_MKBOOTIMG_ARGS := --header_version $(BOARD_BOOTIMG_HEADER_VERSION)

          # --- Virtual A/B & Recovery Partition Flags ---
          BOARD_USES_VENDOR_BOOTIMAGE := true
          BOARD_BUILD_VENDOR_BOOT_IMAGE := true
          BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT := true
          TARGET_RECOVERY_FSTAB := device/infinix/X6855/rootdir/etc/recovery.fstab
          TARGET_RECOVERY_INITRCS := device/infinix/X6855/rootdir/etc/init.recovery.mt6789.rc

          # --- File Systems & Storage ---
          BOARD_HAS_LARGE_FILESYSTEM := true
          BOARD_BOOTIMAGE_PARTITION_TYPE := ext4
          BOARD_USERDATAIMAGE_FILE_SYSTEM_TYPE := f2fs
          BOARD_VENDORIMAGE_FILE_SYSTEM_TYPE := ext4

          # --- Dynamic Partitions (Super) ---
          BOARD_SUPER_PARTITION_METADATA_DEVICE := super
          BOARD_SUPER_PARTITION_BLOCK_DEVICES := super

          # --- Enkripsi & Dekripsi (Crypto / FBE) ---
          TW_INCLUDE_CRYPTO := true
          TW_INCLUDE_CRYPTO_FBE := true
          BOARD_USES_METADATA_PARTITION := true

          # --- Tema, Resolusi, & Tampilan Layar ---
          TW_THEME := portrait_hdpi
          TW_BRIGHTNESS_PATH := "/sys/class/backlight/panel/brightness"
          TW_MAX_BRIGHTNESS := 255
          TW_DEFAULT_BRIGHTNESS := 100
          TW_Y_OFFSET := 0
          TW_H_OFFSET := 0

          # --- Universal Recovery Configurations (TWRP / OrangeFox) ---
          RECOVERY_SDCARD_ON_DATA := true
          TARGET_USE_CUSTOM_LCHMOD := true
          TW_EXCLUDE_DEFAULT_USB_STORAGE := true
          TW_USE_TOOLBOX := true
          TW_INCLUDE_NTFS_3G := true
          TW_USE_NEW_MINADBD := true
          
          # --- OrangeFox Advanced Compatibility & Security Flags ---
          FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER := true
          OF_KEEP_DM_VERITY := true
          OF_PATCH_AVB20 := true
          OF_QUICK_BACKUP_LIST := "/boot;/data;/vendor_boot;"
          OF_USE_TWRP_SAR_DETECT := true
          FOX_VIRTUAL_AB_DEVICE := true
          EOF

          echo "Membuat Android.mk..."
          cat << 'EOF' > $DIR/Android.mk
          LOCAL_PATH := $(call my-dir)

          ifeq ($(BOARD_VNDK_VERSION),current)
          include $(CLEAR_VARS)
          include $(call all-subdir-makefiles,$(LOCAL_PATH))
          endif
          EOF

          echo "Membuat AndroidProducts.mk..."
          cat << 'EOF' > $DIR/AndroidProducts.mk
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/twrp_X6855.mk \
              $(LOCAL_DIR)/fox_X6855.mk

          COMMON_DEVICE_CHOICES := \
              twrp_X6855 \
              fox_X6855
          EOF

          echo "Membuat device.mk..."
          cat << 'EOF' > $DIR/device.mk
          LOCAL_PATH := device/infinix/X6855

          PRODUCT_PACKAGES += \
              libinit_Infinix-X6855 \
              orangefox_installer \
              magisk \
              busybox \
              e2fsck \
              mke2fs \
              tune2fs \
              ntfsfix \
              ntfs-3g \
              bash \
              zip \
              unzip

          PRODUCT_VENDOR_PROPERTIES += \
              ro.crypto.system_vold_support=true \
              persist.recovery.verbose=true
          EOF

          echo "Membuat twrp_X6855.mk..."
          cat << 'EOF' > $DIR/twrp_X6855.mk
          $(call inherit-product, $(SRC_TARGET_DIR)/product/full_base_telephony.mk)
          $(call inherit-product, vendor/omni/config/common.mk)
          $(call inherit-product, device/infinix/X6855/device.mk)

          PRODUCT_DEVICE := X6855
          PRODUCT_NAME := twrp_X6855
          PRODUCT_BRAND := Infinix
          PRODUCT_MODEL := Infinix Note 50 Pro
          PRODUCT_MANUFACTURER := infinix
          EOF

          echo "Membuat fox_X6855.mk..."
          cat << 'EOF' > $DIR/fox_X6855.mk
          $(call inherit-product, $(SRC_TARGET_DIR)/product/full_base_telephony.mk)
          $(call inherit-product, vendor/omni/config/common.mk)
          $(call inherit-product, vendor/fox/config/common.mk)
          $(call inherit-product, device/infinix/X6855/device.mk)

          PRODUCT_DEVICE := X6855
          PRODUCT_NAME := fox_X6855
          PRODUCT_BRAND := Infinix
          PRODUCT_MODEL := Infinix Note 50 Pro
          PRODUCT_MANUFACTURER := infinix

          FOX_BUILD_DEVICE := X6855
          FOX_USE_BASH_SHELL := true
          FOX_ASH_IS_BASH := true
          FOX_USE_SED := true
          FOX_USE_TAR_BINARY := true
          FOX_USE_ZIP_BINARY := true
          FOX_ENABLE_APP_MANAGER := true

          PRODUCT_PROPERTY_OVERRIDES += \
              ro.fox.device.codename=X6855 \
              ro.recovery.ui.margin_height=100 \
              ro.ven.device.prefix=Infinix \
              fox.build_type=Official
          EOF

          echo "Membuat vendorsetup.sh dan README.md..."
          cat << 'EOF' > $DIR/vendorsetup.sh
          add_lunch_combo twrp_X6855-eng
          add_lunch_combo twrp_X6855-userdebug
          add_lunch_combo fox_X6855-eng
          add_lunch_combo fox_X6855-userdebug
          EOF

          cat << 'EOF' > $DIR/README.md
          # Infinix X6855 Universal Recovery Device Tree (God Tier)
          Absolute complete foolproof tree with full kernel, dtb, dtbo, init rc, crypto/FBE support, sepolicy contexts, mkbootimg args, super partition configs, and adb debugging enabled.
          EOF

          echo "Seluruh file perangkat MT6789 ABSOLUT terlengkap berhasil disusun!"

      - name: Compress Ultimate Device Tree
        run: |
          zip -r Absolute_GodTier_MT6789_X6855_Tree.zip device/infinix/X6855

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Absolute_GodTier_MT6789_X6855_Tree
          path: Absolute_GodTier_MT6789_X6855_Tree.zip
          
